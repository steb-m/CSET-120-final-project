<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manager Sign In</title>
    <link rel="stylesheet" href="signInStyle.css">
</head>

<body class="manager">
    <img src="../Images/TheGoldenFork.jpg" alt="The Golden Fork Logo" class="logo-image">
    <h2 class="signIn-heading">Manager Sign In</h2>
    <section class="signIn-items">
        <div class="input-format">
            <input type="text" placeholder="Email" name="email-input" class="signIn-input" id="manager-email-input">
        </div>
        <div class="input-format">
            <input type="password" placeholder="Password" name="password-input" class="signIn-input" id="manager-password-input">
        </div>
        <p class="signIn-message" id="manager-signIn-message">Sign In Message. You shouldn't be able to see this.</p>
        <div class="signIn-buttons">
            <button class="signIn-button" id="manager-signIn-button">Sign In</button>
            <button class="signIn-button" id="customer-register-button" hidden>Unused   </button>
        </div>
    </section>
    <script src="signInScript.js"></script>
    <script src="../Scripts/userData.js"></script>
</body>

</html>
