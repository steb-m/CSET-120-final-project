<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="signinStyle.css">
</head>

<body>
    <img src="../Images/TheGoldenFork.jpg" alt="The Golden Fork Logo" class="logo-image">
    <h2 class="signin-heading">Sign in or create an account</h2>
    <section class="signin-items">
        <div class="input-format">
            <input type="text" placeholder="Email" name="email-input" class="signin-input" id="email-input">
        </div>
        <div class="input-format">
            <input type="text" placeholder="Password" name="password-input" class="signin-input" id="password-input">
        </div>
        <div class="signin-buttons">
            <button class="signin-button">Sign In</button>
            <button class="signin-button">Register</button>
        </div>
    </section>
    <script src="signinScript.js"></script>
</body>

</html>
